services:
  postgres:
    image: postgres:16-alpine
    container_name: sprintpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sprintpilot_db
      POSTGRES_USER: sprintpilot_user
      POSTGRES_PASSWORD: sprintpilot_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprintpilot_user -d sprintpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sprintpilot-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sprintpilot_db
      SPRING_DATASOURCE_USERNAME: sprintpilot_user
      SPRING_DATASOURCE_PASSWORD: sprintpilot_secret_password
      APP_JWT_SECRET: sprintpilotSuperSecretProductionKeyDoNotShareInPublicRepositoriesMinimum256BitsLongEnterpriseSecurity2026Key!
      APP_JWT_EXPIRATION_MS: 86400000
      APP_CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:3000,http://localhost:80
      OPENAI_API_KEY: ""
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sprintpilot-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
